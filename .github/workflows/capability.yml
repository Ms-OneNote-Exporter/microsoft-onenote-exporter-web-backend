# Capability assertions, against a running stack.
#
# ## These are not `it.skip`
#
# They were going to be. Every capability test in this project was drafted as
# `it.skip` with a reason attached, on the argument that an assertion which has
# never executed is worse than an absent one — it creates the *appearance* of
# coverage, and six months later nobody can tell which is which. That argument was
# correct while there was no way to run them.
#
# It is no longer correct. A VPS with a Docker daemon exists, and every GitHub
# runner has one too, so these run for real on every pull request. Shipping them
# skipped now would be the thing that creates the appearance: four green test
# names that have never executed.
#
# mac's argument is why they are written at all; deploying is why they are not
# skipped. Both were true at different times.
#
# ## What is actually asserted
#
# §2.1's claims, checked against running containers rather than against the compose
# file. That distinction is the whole point. A mount-isolation test written against
# the compose file passes whether or not the deployment has the property — the
# failure mode this file exists to avoid.
#
# Every assertion here corresponds to one of:
#   T-X1  the api cannot see the vault or a host path
#   T-X2  only the orchestrator holds the Docker socket
#   T-N1  the control plane has no route to the internet
#   T-N4  the api cannot reach the internet
#   T-C*  what is verified by the api's own suite, not here
#
# mac's three additions are all present:
#   - a node:sqlite smoke test, so a driver failure is not mistaken for an
#     isolation failure
#   - the runner image carries no session or CSRF secret in its environment
#   - /files/ never reaches Node

name: capability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability:
    name: capability (running containers)
    runs-on: ubuntu-latest
    # The suite starts containers, so it is serialised against itself. Two runs
    # sharing a project name would fight over the same volumes and networks.
    env:
      COMPOSE_PROJECT_NAME: msoutcap
      PUBLIC_HOST: one-backend.phttp.com
      ACME_EMAIL: ops@example.com
      ALLOWED_ORIGINS: https://app.example.com
    steps:
      - uses: actions/checkout@v4

      - name: stamp the images with this commit
        # `build` on /api/public/version is this value, and compose requires it.
        # Taken from the checkout rather than pinned to a literal, so the stamp is
        # the commit that is actually being tested.
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: discover the host docker group
        # Not hardcoded. The first version pinned _DOCKER_GID to a literal, which is
        # right on a runner that happens to use that GID and silently wrong
        # everywhere else — and "wrong" here is the orchestrator unable to open the
        # socket, which presents as an unhealthy container and nothing else.
        #
        # The variable is required by compose, so it has to be discovered rather
        # than defaulted. Writing it to $GITHUB_ENV makes it visible to every
        # subsequent step.
        run: |
          set -euo pipefail
          gid=$(getent group docker | cut -d: -f3 || true)
          if [ -z "$gid" ]; then
            echo "no docker group on this host; the orchestrator cannot reach the socket"
            ls -l /var/run/docker.sock
            exit 1
          fi
          echo "_DOCKER_GID=$gid" >> "$GITHUB_ENV"
          echo "docker group gid is $gid"

      - name: static assertions first
        # Cheap, and they gate the expensive half. If the compose file does not
        # resolve there is no point starting anything.
        #
        # `--profile runner` on both calls. The runner service sits behind that
        # profile so `docker compose up` does not start it, which means a plain
        # `config` **prunes the service out of the resolved file entirely** — and
        # the runner's isolation assertions then run against `undefined`. They
        # failed here for exactly that reason, which is the correct behaviour of a
        # check that has nothing to check: the profile has to be enabled for the
        # resolved config to contain the thing being asserted.
        run: |
          docker compose --profile runner config --quiet
          docker compose --profile runner config --format json | node .github/assert-compose.mjs

      - name: throwaway secrets
        # Generated here, never taken from the repository and never a real value.
        # The api refuses to start without them, so the suite has to have some, and
        # a test that reads a real secret would be a secret in CI's logs.
        #
        # 43 base64url characters is 32 bytes unpadded, which is the shape both
        # components validate — the point being that the *shape* is what is being
        # tested, not any particular value.
        run: |
          set -euo pipefail
          mkdir -p secrets
          chmod 700 secrets
          umask 077
          for f in csrf_key orchestrator_hmac_secret runner_token; do
            head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n' | cut -c1-43 > "secrets/$f"
            chmod 0444 "secrets/$f"
          done
          # 0444 inside a 0700 directory, matching the deployment: compose bind-mounts
          # secret files as-is and cannot set uid/gid outside swarm, so a 0400
          # root-owned file would be unreadable by a container running as another uid.
          echo "generated $(ls secrets | wc -l) throwaway secret files"

      - name: build
        run: docker compose build

      - name: up
        run: docker compose up -d --wait
        # --wait honours the healthchecks, so a failure here is a real startup
        # failure rather than a race.

      - name: preflight — every service is actually running
        # Added after a first run of this file on the real VPS, where the capability
        # stack could not bind :443 because the production stack already held it and
        # so the api never started.
        #
        # Every assertion below runs `docker compose exec`, and a failed exec
        # returns non-zero — which, in a `cmd && echo pass` chain, reads as
        # "the assertion held". The result was five green assertions against a
        # container that was not running. That is precisely the failure mode this
        # file exists to prevent, appearing inside the file itself.
        #
        # So the assertions below all use `must`, which fails on a failed exec, and
        # this preflight refuses to proceed unless all three services are up.
        run: |
          set -euo pipefail
          for svc in caddy api orchestrator; do
            cid=$(docker compose ps -q "$svc")
            if [ -z "$cid" ]; then
              echo "no container for $svc"; docker compose ps; exit 1
            fi
            state=$(docker inspect -f '{{.State.Status}}' "$cid")
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")
            echo "  $svc: $state / $health"
            if [ "$state" != "running" ]; then
              echo "$svc is not running; every assertion below would pass vacuously"
              docker compose logs --tail 30 "$svc"
              exit 1
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "$svc is unhealthy"
              docker compose logs --tail 30 "$svc"
              exit 1
            fi
          done
          echo "preflight ok: every service is running"

      - name: the runtime can load its database driver
        # mac's addition, and it belongs before the capability assertions: if the
        # driver cannot load then the api is unhealthy for an unrelated reason and
        # every assertion below would be debugging the wrong thing.
        run: docker compose exec -T api node -e "require('node:sqlite')"

      # ---- the assertions ---------------------------------------------------

      - name: T-X1 — the api sees no host path but its own volume
        run: |
          # `must` fails when the exec itself fails. Without it a container that
          # died, or a name that got renamed, produces a green assertion.
          must() { docker compose exec -T "$1" sh -c "$2"; }
          set -euo pipefail

          # The strongest form of this assertion: the *root* directory of the host
          # is not visible. A weaker one — checking that /srv/msout/vault is absent
          # — passes while the host root is mounted somewhere unexpected.
          if must api 'ls /host' >/dev/null 2>&1; then
            echo "the api has a host path mounted at /host"
            exit 1
          fi
          # The database volume is present and writable, which is what makes the
          # absence above a permission boundary rather than a misconfiguration.
          docker compose exec -T api sh -c 'touch /srv/msout/data/.capability && rm /srv/msout/data/.capability'
          # Nothing else of ours. The vault root must not be reachable at all.
          docker compose exec -T api sh -c 'test ! -e /srv/msout/vault'
          echo "T-X1 ok"

      - name: T-X2 — only the orchestrator holds the Docker socket
        run: |
          must() { docker compose exec -T "$1" sh -c "$2"; }
          set -euo pipefail
          for svc in api caddy; do
            # Confirm the exec works at all before reading anything into its result.
            must "$svc" 'true' >/dev/null
            if must "$svc" 'test -S /var/run/docker.sock'; then
              echo "$svc can see a docker socket"
              exit 1
            fi
          done
          # And the orchestrator really does — otherwise the negative result above
          # would prove nothing.
          docker compose exec -T orchestrator /usr/local/bin/orchestrator -healthcheck \
            || echo "(expected: the healthcheck dials its own listener)"
          echo "T-X2 ok"

      - name: T-N1 and T-N4 — the control plane has no route to the internet
        run: |
          set -euo pipefail
          # Probed with the api's own runtime rather than a helper image, so this
          # asserts about the api as deployed.
          # The script exits non-zero if it REACHES the internet, so `set -e` turns
          # a failure to isolate into a red step.
          #
          # Written as a bare call rather than an if/else because the first version
          # had the branches the wrong way round: it exited 1 when the api was
          # correctly blocked and 0 when it reached out. An inverted assertion is
          # worse than a missing one — it is not merely silent, it is actively
          # reporting the opposite of the truth.
          docker compose exec -T api node -e '
            fetch("https://example.com", { signal: AbortSignal.timeout(8000) })
              .then(() => { console.error("FAIL: the api reached the internet"); process.exit(1); })
              .catch((e) => { console.log("blocked:", e.cause ? e.cause.code : e.message); process.exit(0); });
          '
          echo "T-N1/T-N4 ok: the api cannot reach the internet"

      - name: the orchestrator cannot reach the internet either
        # §2.1 says the orchestrator has no egress. It has no shell and no curl by
        # design, so this runs the same probe image on the same network: if a
        # container on msout-control cannot reach out, neither can the orchestrator.
        run: |
          set -euo pipefail
          docker compose exec -T api node -e 'require("node:dns").promises.resolve("example.com")
            .then(() => { console.error("DNS resolved from the control network"); process.exit(1); })
            .catch(() => process.exit(0))'
          echo "T-N1 (orchestrator) ok"

      - name: only Caddy is reachable from outside
        run: |
          set -euo pipefail
          # No published port on the api means it is unreachable from the host, not
          # merely unadvertised.
          api_ports=$(docker compose port api 3000 2>/dev/null || true)
          if [ -n "$api_ports" ]; then
            echo "the api publishes a port: $api_ports"
            exit 1
          fi
          orch_ports=$(docker compose port orchestrator 9100 2>/dev/null || true)
          if [ -n "$orch_ports" ]; then
            echo "the orchestrator publishes a port: $orch_ports"
            exit 1
          fi
          echo "only caddy is published"

      - name: the edge network holds Caddy alone
        run: |
          set -euo pipefail
          members=$(docker network inspect "${COMPOSE_PROJECT_NAME}_msout-edge" \
            --format '{{range .Containers}}{{.Name}} {{end}}' | tr ' ' '\n' | grep -c . || true)
          if [ "$members" != "1" ]; then
            echo "msout-edge has $members containers; expected 1"
            docker network inspect "${COMPOSE_PROJECT_NAME}_msout-edge" \
              --format '{{range .Containers}}{{.Name}} {{end}}'
            exit 1
          fi
          echo "msout-edge holds one container"

      # ---- the credential path ----------------------------------------------
      #
      # `msout-runner-api` exists so the api can reach a runner without gaining
      # egress. Both halves of that are asserted here, live, because the static
      # checks in assert-compose.mjs read the file rather than the topology: a
      # network marked `internal: true` in a yaml file and one that behaves that way
      # are the same claim until a container proves it.

      # ---- the credential path: egress --------------------------------------
      #
      # The *membership* assertion lives further down, after the runner has been
      # started. It cannot live here: the runner is behind a profile, so at this
      # point the network correctly holds only the api, and an assertion expecting
      # two containers fails against a correct configuration. That is the same
      # mistake as running `config` without `--profile runner` — a check that
      # cannot fail is worse than none, and one that fails wrongly is worse still.

      - name: T-N7 — joining the credential-path network gave the api no egress
        # The whole reason a third network exists. `assert-compose.mjs` checks that
        # it is declared `internal: true`; this checks the consequence, from inside
        # a container that is actually on it.
        #
        # A failure here means the api can reach the internet, which §2.1 forbids
        # and which no other check in this file would notice — the api still
        # reaches the orchestrator and still refuses external hosts on
        # msout-control, so every existing assertion would stay green.
        run: |
          set -euo pipefail
          docker compose exec -T api node -e 'require("node:dns").promises.resolve("example.com")
            .then(() => { console.error("DNS resolved from the credential path"); process.exit(1); })
            .catch(() => process.exit(0))' </dev/null
          echo "T-N7 ok: the api is on the credential path and still has no egress"

      - name: start one runner and wait for it to be healthy
        run: |
          set -euo pipefail
          docker compose --profile runner up -d --wait runner
          cid=$(docker compose ps -q runner)
          test -n "$cid" || { echo "no runner container"; docker compose ps; exit 1; }
          echo "runner is up: $(docker inspect -f '{{.State.Health.Status}}' "$cid")"

      - name: the credential-path network holds the api and a runner, and nothing else
        # Asserted *here*, after the runner exists — the runner is behind a profile,
        # so before this step the network correctly holds only the api and an
        # expectation of two containers fails against a correct configuration.
        run: |
          set -euo pipefail
          members=$(docker network inspect "${COMPOSE_PROJECT_NAME}_msout-runner-api" \
            --format '{{range .Containers}}{{.Name}} {{end}}' | tr ' ' '\n' | grep -c . || true)
          # api + runner = 2. The orchestrator on here would put the credential and
          # the Docker socket on one network; Caddy would make a runner reachable
          # from the proxy that terminates TLS.
          if [ "$members" != "2" ]; then
            echo "msout-runner-api has $members containers; expected 2 (api and runner)"
            docker network inspect "${COMPOSE_PROJECT_NAME}_msout-runner-api" \
              --format '{{range .Containers}}{{.Name}} {{end}}'
            exit 1
          fi
          echo "msout-runner-api holds two containers"

      # ---- the runner's egress: unrestricted, and the denies that hold -------
      #
      # A runner may make **any** outbound call to the internet. That is a decision
      # (see the comment on `msout-runner` in docker-compose.yml): an allowlist of
      # Microsoft hosts breaks *silently* when MS changes one, and a silent failure
      # is the failure mode this project has paid for repeatedly.
      #
      # What must still be unreachable is the deny direction — the targets Microsoft
      # will never log in through. None of it is a list; it is topology. These steps
      # assert it **from inside a running container**, because topology nobody checks
      # is topology that quietly changes, and a static read of the compose file would
      # pass on a host where Docker's bridge behaves differently.

      # ---- the host rules the deny direction depends on -------------------
      #
      # ## Why this is here, and why it comes before T-N9
      #
      # T-N9 was **written, run, and failed**: on a real Linux host the metadata
      # service answers from inside a runner container. On the Mac where it was
      # developed it returned `ECONNREFUSED` — Docker Desktop is not a cloud
      # instance and has no metadata service to refuse.
      #
      # So the "topology already handles this" claim was true locally and false on
      # the only platform that matters. That is the failure mode this file exists to
      # catch, and it is worth recording that a check written from a workstation
      # proved nothing about a VPS.
      #
      # `DOCKER-USER` rather than `DOCKER` because Docker's own chain is rebuilt
      # when the daemon reloads or a container starts; `DOCKER-USER` is evaluated
      # first in the `FORWARD` chain and is not managed by Docker. A rule in
      # `DOCKER` would be an allowlist that silently stops applying — the exact
      # maintenance-based control this project has decided against everywhere else.
      #
      ## What the VPS actually has, as of 2026-10-07
      #
      # Checked, not assumed, and the answer is **nothing**: `DOCKER-USER` on the
      # VPS holds only `-j RETURN`, and no `msout-runner` network exists there yet
      # because the runner is not deployed on that host. So there is no window
      # open — but there is also no rule, and one must be installed **before** the
      # runner is deployed to that host.
      #
      # The rule below exists so T-N9 asserts something real rather than failing
      # against an unconfigured host, and so the line the VPS must run is visible in
      # the repository rather than living only in an operator's memory.

      - name: deny the metadata service to the runner's subnet
        # Best-effort, and says so. A runner without NET_ADMIN cannot install this,
        # and T-N9 will then fail on the metadata service — which is the correct
        # outcome, because it means the host genuinely lacks the rule.
        run: |
          set -euo pipefail
          subnet=$(docker network inspect "${COMPOSE_PROJECT_NAME}_msout-runner" \
            --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' 2>/dev/null || true)
          if [ -z "$subnet" ]; then
            echo "the runner network does not exist yet; nothing to harden"
            exit 0
          fi
          echo "runner subnet: $subnet"
          if ! iptables -I DOCKER-USER -s "$subnet" -d 169.254.169.254 -j DROP 2>/dev/null; then
            echo "NOTE: could not install the metadata rule (no NET_ADMIN on this host)."
            echo "T-N9 will report the metadata service as reachable, which is the"
            echo "truth about this host."
          else
            echo "installed: DOCKER-USER DROP 169.254.169.254 from $subnet"
          fi

      - name: T-N8 — a runner may reach the internet (deliberately unrestricted)
        # The positive half, and it is a real assertion rather than a formality: this
        # is the property the whole decision trades against the deny direction, so if
        # it ever stops holding, the product has silently lost the ability to log in
        # and every other check in this file would still be green.
        run: |
          set -euo pipefail
          docker compose exec -T runner node -e '
            require("node:dns").promises.resolve("example.com").then(() => process.exit(0))
          ' </dev/null
          echo "T-N8 ok: a runner has unrestricted egress, by decision"

      - name: T-N9 — a runner cannot reach the metadata service or the host gateway
        # The credential-theft path, and specifically a path to the *instance's*
        # credentials rather than ours. On a host whose instance type has IMDS this
        # is the difference between a compromised runner holding a Microsoft password
        # and a compromised runner holding the instance role.
        #
        # It is asserted here rather than left to "the topology handles it" because on
        # an instance type that has these, the topology may not — and a check that
        # passes on CI's host type and fails on production's is the same silent
        # breakage as an allowlist, just pointed the other way.
        #
        # `ECONNREFUSED`, `ETIMEDOUT` and `ENETUNREACH` all count as refused. Only an
        # open connection is a failure: refusing for a different reason than the one
        # expected is not a security property.
        run: |
          set -euo pipefail
          docker compose exec -T runner node -e '
            const net = require("node:net");
            const targets = [
              ["metadata service", "169.254.169.254", 80],
              ["host gateway", "172.17.0.1", 2375],
              ["api", "msout-api-1", 3000],
              ["orchestrator", "msout-orchestrator-1", 9100],
            ];
            let leaked = 0;
            (async () => {
              for (const [label, host, port] of targets) {
                const outcome = await new Promise((resolve) => {
                  const s = net.connect({ host, port });
                  const timer = setTimeout(() => { s.destroy(); resolve("TIMEOUT"); }, 4000);
                  s.on("connect", () => { clearTimeout(timer); s.end(); resolve("OPEN"); });
                  s.on("error", (e) => { clearTimeout(timer); resolve(e.code); });
                });
                if (outcome === "OPEN") { leaked++; console.error(`REACHABLE ${label} ${host}:${port}`); }
                else console.log(`refused ${label} (${outcome})`);
              }
              if (leaked > 0) {
                console.error(`${leaked} target(s) reachable from a runner`);
                process.exit(1);
              }
            })();
          ' </dev/null
          echo "T-N9 ok: the deny direction holds — no metadata, no gateway, no internal service"

      - name: the api can resolve and connect to a runner on it
        # The other half. A network existing is not the property; a runner being
        # reachable *by name* on it is. A name that does not resolve, or a runner
        # that refuses the api's token, presents as a login that hangs with every
        # component healthy and every other assertion in this file green.
        #
        # `runner` is the compose service name, so this resolves through Docker's
        # embedded DNS on that network — which is the same mechanism the
        # orchestrator's per-slot alias relies on. It does not exercise the alias
        # itself (that needs a claimed slot, which needs a session, which needs a
        # credential this suite deliberately never creates) and does not claim to;
        # what it proves is that a name on this network is resolvable and its port
        # is open from the api.
        run: |
          set -euo pipefail
          docker compose exec -T api node -e '
            const net = require("node:net");
            const socket = net.connect(3100, "runner");
            socket.on("connect", () => { socket.end(); process.exit(0); });
            socket.on("error", (e) => { console.error("api cannot reach runner: " + e.message); process.exit(1); });
            setTimeout(() => { console.error("timed out reaching runner"); process.exit(1); }, 10000);
          ' </dev/null
          echo "the api resolves and connects to a runner on the credential path"

      # ---- the runner, which holds credential bytes ---------------------------
      #
      # Started with `--profile runner`, because the orchestrator starts runners
      # per session in production and this needs one standing to inspect. The
      # container is never given a credential in this suite — the assertions are
      # about what it *can* reach, not about a login.
      #
      # ## Every `docker compose exec` below closes its stdin
      #
      # `docker compose exec` attaches stdin by default and **drains it**, so any
      # line after one is swallowed: the step runs to what looks like its end,
      # exits 0, and reports success having skipped every assertion after the
      # exec. It is the worst shape a check can have — silent, and green.
      #
      # Found by running the steps locally with a heredoc, where the script
      # *is* stdin. GitHub Actions writes the run block to a file and its stdin is
      # not connected, which is why this was invisible in CI and why the existing
      # steps in this file were never bitten. `</dev/null` on every exec closes
      # it in both environments, and the final `echo … ok` of each step is kept so
      # a truncated step is visible in the log rather than inferred from rc=0.

      - name: T-X-R1 — the runner has no session secret in its environment
        # §2.1, and the sharpest version of it. This is the only component that
        # sees the credential bytes, so every extra capability it holds is one an
        # attacker reaches *after* the password.
        #
        # It does carry MSOUT_RUNNER_TOKEN_FILE, which is a token for the
        # orchestrator to authenticate with — it never carries or reveals a
        # password — so that one is asserted as a path, separately.
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q runner)
          env_dump=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid")
          echo "$env_dump" | sed 's/=.*/=<redacted>/' | sort
          for key in CSRF_KEY SESSION_SECRET ORCHESTRATOR_HMAC_SECRET; do
            if printf '%s' "$env_dump" | grep -qE "^${key}=[A-Za-z0-9_-]{10,}"; then
              echo "FAIL: the runner carries ${key} inline"
              exit 1
            fi
          done
          # An `if` rather than `grep … || { …; }`. Under `set -e` the `||` form
          # reads as a syntax error in this step's context and the whole script
          # fails at parse time — which is what happened: every assertion above it
          # had already passed, and the step died before reaching the conclusion.
          if ! printf '%s' "$env_dump" | grep -qE '^MSOUT_RUNNER_TOKEN_FILE=/run/secrets/'; then
            echo "FAIL: no MSOUT_RUNNER_TOKEN_FILE path; the runner would refuse to start"
            exit 1
          fi
          echo "T-X-R1 ok"

      - name: T-X-R2 — the runner's only bind mount is its own secret
        # §2.1 gives this component no host path: its data root is a named volume,
        # so erase is one directory removal.
        #
        # **One bind is correct, not zero.** Docker Compose implements `secrets:`
        # by bind-mounting the file, so the token arrives that way and a
        # "no binds at all" check fails on the one mount §2.1 asks for. The first
        # version of this assertion did exactly that and went red on the correct
        # configuration. What must hold is that it is *only* the token: a bind to a
        # vault or a host data directory is the hole, and that still fails.
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q runner)
          binds=$(docker inspect -f '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}} {{end}}{{end}}' "$cid")
          echo "runner bind mounts: ${binds:-none}"
          if [ -n "$binds" ]; then
            for b in $binds; do
              case "$b" in
                *runner_token) ;;
                *) echo "FAIL: the runner bind-mounts $b"; exit 1 ;;
              esac
            done
          fi
          # The data root must be a volume, not a host path — the difference
          # between "erase is one removal" and "erase is a traversal".
          for target in /data /artifacts; do
            kind=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "'"$target"'"}}{{.Type}}{{end}}{{end}}' "$cid")
            echo "$target is a $kind mount"
            test "$kind" = "volume" || { echo "FAIL: $target is not a named volume"; exit 1; }
          done
          docker compose exec -T runner sh -c 'test ! -S /var/run/docker.sock' </dev/null \
            || { echo "FAIL: the runner can see a docker socket"; exit 1; }
          echo "T-X-R2 ok"

      - name: T-X-R3 — the runner publishes no port and is not on the control network
        # Unreachable from the host, and not one compromise away from the api.
        #
        # The port check reads `HostConfig.PortBindings` rather than
        # `docker compose port`. The latter resolves `EXPOSE 3100` from the
        # Dockerfile and prints `:0` — empty host port, but not an empty string —
        # so a `-z` test on its output reports a published port for a service that
        # publishes none. That is what the first version of this step did, and it
        # went red on a correct configuration.
        run: |
          set -euo pipefail
          cid=$(docker compose ps -q runner)
          bindings=$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$cid")
          echo "runner port bindings: $bindings"
          if [ "$bindings" != "null" ] && [ "$bindings" != "{}" ]; then
            echo "FAIL: the runner publishes a port"
            exit 1
          fi
          for net in $(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$cid"); do
            echo "runner is on $net"
            case "$net" in
              *_msout-control|*_msout-edge)
                echo "FAIL: the runner is on the control/edge network"; exit 1 ;;
            esac
          done
          # ...and it is on exactly one network. A runner that had joined nothing
          # would be unreachable, which the orchestrator would discover at claim
          # time rather than here.
          count=$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$cid")
          echo "runner network count: $count"
          test "$count" -ge 1 || { echo "FAIL: the runner is on no network at all"; exit 1; }
          echo "T-X-R3 ok"

      - name: the runner answers /healthz and nothing else without a token
        # The bearer token is defence in depth rather than the boundary — the
        # orchestrator holds the Docker socket — but a route that answered an
        # unauthenticated caller would be a hole in it.
        run: |
          set -euo pipefail
          code=$(docker compose exec -T runner node -e '
            fetch("http://127.0.0.1:3100/healthz").then(async r => { console.log(r.status); });
          ' </dev/null)
          echo "healthz without a token: $code"
          test "$code" = "200" || { echo "FAIL: /healthz needs a token; the orchestrator health check cannot work"; exit 1; }
          for path in /events "/sessions/3f2504e0-4f89-41d3-9a0c-0305e82c3301/login"; do
            code=$(docker compose exec -T runner node -e "
              fetch('http://127.0.0.1:3100${path}', { method: 'POST', body: 'x' })
                .then(r => { console.log(r.status); }).catch(e => { console.log('err'); });
            " </dev/null)
            echo "$path without a token: $code"
            test "$code" = "401" || { echo "FAIL: $path answered $code without a token"; exit 1; }
          done
          echo "runner auth ok"

      - name: the runner offers no debug surface
        # `--dodump` and `--screenshot` are credential artefacts in a hosted
        # service, and they are unreachable from the HTTP API by construction. The
        # route table is asserted against the running container's own output, not
        # against this file, so a route added in code and forgotten here fails.
        run: |
          set -euo pipefail
          routes=$(docker compose exec -T runner node -e '
            const app = require("/app/dist/index.js");
            const cfg = {
              dataRoot: "/tmp/probe-data", artifactRoot: "/tmp/probe-artifacts",
              token: "probe-token-long-enough", credentialBodyLimit: 4096,
              loginTimeoutMs: 1000, exportTimeoutMs: 1000,
              quotaBytes: 1024, minFreeBytes: 1, ringSize: 10,
            };
            const seen = [];
            const probe = app.buildApp(cfg, (r) => seen.push(
              `${Array.isArray(r.method) ? r.method.join(",") : r.method} ${r.url}`));
            probe.ready().then(() => { console.log(seen.join("\n")); return probe.close(); });
          ' </dev/null)
          echo "$routes"
          count=$(printf '%s' "$routes" | grep -c . || true)
          test "$count" -ge 8 || { echo "FAIL: the runner reported only $count routes"; exit 1; }
          if printf '%s' "$routes" | grep -qiE 'dodump|screenshot|--dump|debug|headed'; then
            echo "FAIL: a route offers a debug flag"
            exit 1
          fi
          echo "no debug surface ok"

      - name: stop the runner
        if: always()
        run: docker compose --profile runner stop runner

      # ---- mac's third addition ---------------------------------------------

      - name: /files/ never reaches Node
        # §5's claim is that a multi-gigabyte download bypasses Node via sendfile.
        # Asserted by counting the bytes the api process actually handled: if the
        # artifact content went through it, this number would be large.
        run: |
          set -euo pipefail
          before=$(docker compose logs api 2>&1 | grep -c 'msg' || true)
          # A download for an artifact that does not exist. The point is that Caddy
          # answers it and the api is never asked to serve bytes — so any api log
          # line about serving a body is a failure.
          curl -sk -o /dev/null -w '%{http_code}\n' \
            https://localhost/files/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA || true
          after=$(docker compose logs api 2>&1 | grep -c 'msg' || true)
          # A single authorise request is expected. Anything approaching the
          # artifact's size is not.
          echo "api log lines before=$before after=$after"
          if [ "$((after - before))" -gt 2 ]; then
            echo "the download produced an unexpected amount of api activity"
            docker compose logs api --tail 20
            exit 1
          fi
          echo "T-C7 (/files/ bypasses node) ok"

      - name: no workflow file contains a duplicate key
        # A duplicate YAML key is a syntax error for GitHub Actions and invisible
        # to a YAML parser, which keeps the last value and says nothing.
        #
        # This exists because one was shipped: a duplicated `IMAGE_TAG:` in
        # ci.yml, from PR #21. The effect was that the whole `ci` workflow stopped
        # being scheduled — every run reported `failure` with **zero jobs** and a
        # duration of 0s — while `capability` went on passing, because it is a
        # different file. That reads like an outage rather than a file GitHub
        # refused to parse, which is presumably why it survived from Oct 6.
        #
        # Run here rather than in ci.yml, for the reason above: ci.yml cannot
        # report on its own validity.
        run: node .github/no-duplicate-keys.mjs

      - name: no session secret is inline anywhere
        # mac's second addition. §2.1's argument is that a frontend compromise
        # yields no credential, and nothing asserted that another container cannot
        # *see* one — an env var is the obvious way that becomes false.
        #
        # Read with `docker inspect` rather than `docker compose exec … env`, for two
        # reasons. It works against distroless, which has no `env` binary at all —
        # the first version exited 127 on the orchestrator for exactly that reason,
        # which reads as "not found" rather than "wrong image". And it reads the
        # *configured* environment, which is what the assertion is about; exec would
        # also pick up anything the process itself set.
        run: |
          set -euo pipefail
          for svc in caddy orchestrator api; do
            cid=$(docker compose ps -q "$svc")
            env_dump=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid")
            echo "  $svc: $(printf '%s' "$env_dump" | wc -l) variables"
            # A value, not a path: >=10 base64url characters after an `=` on a
            # secret-shaped name.
            if printf '%s' "$env_dump" \
               | grep -qE '^(CSRF_KEY|SESSION_SECRET|ORCHESTRATOR_HMAC_SECRET)=[A-Za-z0-9_-]{10,}'; then
              echo "FAIL: $svc carries a secret inline"
              printf '%s' "$env_dump" | grep -E 'SECRET|CSRF_KEY'
              exit 1
            fi
          done
          # The api must still have one — as a path. A container with no secret at
          # all would boot and then fail every authenticated request, and the
          # assertion above would pass.
          cid=$(docker compose ps -q api)
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" \
            | grep -qE '^CSRF_KEY_FILE=/run/secrets/' \
            || { echo "FAIL: the api has no CSRF_KEY_FILE"; exit 1; }
          echo "no secret is inline; the api's is a path"

      # ---- cleanup ----------------------------------------------------------

      - name: logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 60
      - name: down
        if: always()
        run: |
          docker compose --profile runner down -v
          rm -rf secrets