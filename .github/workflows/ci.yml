# Continuous integration.
#
# Three properties this file is trying to have, in order of importance:
#
#   1. **Nothing ships unproven.** Every check here actually runs on every push,
#      and none of them is conditional on a file existing. mac's argument for this
#      shape: an unproven assertion is worse than an absent one, because it creates
#      the *appearance* of coverage. That applies to config at least as much as to
#      tests — a Caddyfile with a misnamed network is not "unproven", it is wrong
#      and shipped.
#   2. **The cheapest check that could catch it runs first.** `docker compose
#      config` parses and resolves the whole compose file without a daemon, which
#      catches a typo'd network name, a missing mount or a bad interpolation. It is
#      the only executable verification available for the infra files on a machine
#      with no Docker socket, so it gates them.
#   3. **The supply chain is checked, not asserted.** Dependency hashes are
#      verified against the lockfile and `npm ci` is used rather than `npm install`,
#      so a lockfile edit that changes a resolved tarball fails the build.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref. A push to a PR branch supersedes the
# run for the earlier commit, and nobody is waiting on that one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The orchestrator is Go with zero third-party dependencies, so its build is
  # hermetic by construction: `go build` cannot reach the network for anything.
  orchestrator:
    name: orchestrator (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Matches the `go` directive in go.mod.
          go-version: "1.25"
          check-latest: false
      - name: deps-zero
        # Enforced twice on purpose: here and in the Dockerfile. A single check is
        # one merge away from being removed by someone who did not know what the
        # zero-dependency property was for.
        working-directory: orchestrator
        run: make deps-zero
      - name: vet
        working-directory: orchestrator
        run: go vet ./...
      - name: test
        working-directory: orchestrator
        run: make test
      - name: race
        # The pool is the only genuinely concurrent code here, and a data race in
        # it would mean one session could be handed another's slot.
        working-directory: orchestrator
        run: make race
      - name: builds a static binary
        # `make build` sets CGO_ENABLED=0 and -trimpath, because the runtime image
        # has no libc to link against.
        working-directory: orchestrator
        run: make build && file bin/orchestrator 2>/dev/null || true

  api:
    name: api (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.13.0 is the floor for node:sqlite. The api's database driver is
          # node:sqlite rather than better-sqlite3 precisely so there is no native
          # addon and no prebuilt-binary supply chain in the component that holds
          # the session secret.
          #
          # Not 22.5.0, which is when node:sqlite was *added* — it stayed behind
          # --experimental-sqlite until 22.13.0, so pinning 22.5 produced a runner
          # that cannot load the driver. The smoke test below is what caught it.
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: node:sqlite is present
        # mac's addition, and it is a smoke test rather than a capability test.
        # Without it, an image that cannot load the driver fails every capability
        # test for an unrelated reason and you learn nothing about isolation.
        #
        # It earned its place immediately: this step is what found that the
        # `engines.node >= 22.5` floor was wrong, because the module was
        # flag-gated until 22.13.0. No test in the suite would ever have found
        # it — every test runs on a developer's Node, not on the declared floor.
        #
        # The flag matters too: `require` must succeed without
        # --experimental-sqlite, because the api's entrypoint does not pass it.
        run: node -e "require('node:sqlite'); console.log('node:sqlite ok, unflagged')"

      - name: install
        # `npm ci` installs exactly the lockfile and fails if it and package.json
        # disagree, so a hand-edited dependency is a red build rather than a
        # silent resolution change.
        run: npm ci

      - name: no audit findings in the shipped dependency tree
        run: npm audit --omit=dev --audit-level=low

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: the entrypoint the container runs exists
        # `src/index.ts` was missing for the whole life of the project and 481 tests
        # passed without it, because they all test `buildServer(config, deps)`
        # directly. So `npm start`, `npm run dev` and the Dockerfile's CMD all named
        # a file that was not there: the image built cleanly and then died on
        # start, and `docker compose up` reported success while doing it.
        #
        # This is the assertion whose absence let that through. It checks the name
        # in package.json and in the Dockerfile against what the build produced,
        # rather than a hardcoded path — so renaming the entrypoint without moving
        # the CMD fails here too.
        run: |
          npm run build
          START_TARGET=$(node -p "require('./package.json').scripts.start.split(' ').pop()")
          echo "package.json start runs: $START_TARGET"
          test -f "$START_TARGET" || {
            echo "$START_TARGET does not exist; npm start would fail"
            exit 1
          }
          DOCKERFILE_CMD=$(grep -oE '"dist/[^"]+"' Dockerfile | tr -d '"' | head -1)
          echo "Dockerfile CMD runs:  $DOCKERFILE_CMD"
          test -f "$DOCKERFILE_CMD" || {
            echo "$DOCKERFILE_CMD does not exist; the container would build and then die"
            exit 1
          }

      - name: the entrypoint boots
        # Not just "the file exists" — the process has to come up. A file that
        # throws on import is the same failure with one more step in it.
        run: |
          mkdir -p /tmp/boot
          printf '%s\n' "$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n' | cut -c1-43)" > /tmp/boot/csrf_key
          chmod 400 /tmp/boot/csrf_key
          cp /tmp/boot/csrf_key /tmp/boot/hmac
          ALLOWED_ORIGINS=https://app.example.com \
          PUBLIC_ORIGIN=https://one-backend.example.com \
          CSRF_KEY_FILE=/tmp/boot/csrf_key \
          ORCHESTRATOR_HMAC_SECRET_FILE=/tmp/boot/hmac \
          ORCHESTRATOR_URL=http://127.0.0.1:9100 \
          DATABASE_PATH=/tmp/boot/api.db \
          LISTEN=127.0.0.1:0 \
          LOG_LEVEL=error \
          timeout 10 node -e '
            const { boot } = require("./dist/index.js");
            const fake = {
              stats: async () => ({ ok: true, value: { size: 2, byState: {}, runnerTtlSeconds: 300, slotIds: ["slot-1", "slot-2"] } }),
              healthz: async () => ({ ok: true, value: { ok: true, pool: { size: 2, byState: {}, runnerTtlSeconds: 300 } } }),
              claim: async () => ({ ok: true, value: { slotId: "slot-1", containerId: "c" } }),
              release: async () => ({ ok: true, value: { released: true } }),
              recycle: async () => ({ ok: true, value: { recycled: true } }),
              remove: async () => ({ ok: true, value: { removed: true } }),
              stat: async () => ({ ok: true, value: { exists: false, size: 0 } }),
            };
            boot(process.env, fake).then((b) => {
              console.log("booted, seeded slots:", b.db.listRunners().length);
              b.db.close();
              process.exit(0);
            }).catch((e) => { console.error("BOOT FAILED:", e.message); process.exit(1); });
          '

      - name: mock code cannot reach the build
        # The mock is a scripted runner that accepts any password and reports
        # success. There must be no path from `npm start` to it.
        run: |
          npm run build
          if [ -d dist/mock ]; then
            echo "dist/mock exists — mock code is in the production build"
            exit 1
          fi
          if grep -rl "MockRunner\|FakeOrchestrator" dist/ ; then
            echo "mock symbols found in dist/"
            exit 1
          fi
          echo "dist/ is free of mock code"

  # The infra files cannot be run here: this job has a Docker daemon, but the
  # capability assertions in capability.yml need a stack that does not exist yet.
  # What it *can* do is parse and resolve them, which catches the majority of
  # realistic mistakes and needs no daemon at all.
  infra:
    name: infra (compose shape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose file parses and resolves
        # `config` does not need a daemon, so this runs anywhere. It catches a
        # misnamed network, a missing mount, a bad interpolation and a service
        # referencing a network that is not declared.
        #
        # The variables are supplied because the file marks them required with
        # `${VAR:?...}`. That syntax is the point: an unset host name is a startup
        # failure, not a silently-defaulted one, and CI must supply values to prove
        # the file resolves at all.
        env:
          COMPOSE_PROJECT_NAME: msout
          PUBLIC_HOST: one-backend.phttp.com
          ACME_EMAIL: ops@example.com
          ALLOWED_ORIGINS: https://app.example.com
        run: docker compose -f docker-compose.yml config --quiet

      - name: the required host name is genuinely required
        # Asserts the guard rather than trusting it. `${PUBLIC_HOST:?}` failing is
        # what stops a typo becoming a deployment on the wrong origin, where every
        # artifact download URL in every snapshot is silently wrong.
        env:
          COMPOSE_PROJECT_NAME: msout
          ACME_EMAIL: ops@example.com
          ALLOWED_ORIGINS: https://app.example.com
          PUBLIC_HOST: ""
        run: |
          if docker compose -f docker-compose.yml config --quiet 2>/dev/null; then
            echo "an empty PUBLIC_HOST was accepted, so the guard is not load-bearing"
            exit 1
          fi
          echo "an empty PUBLIC_HOST is refused"

      - name: static capability assertions
        # \u00a72.1's properties, checked against what Compose *resolved* rather than
        # against the YAML as written. Every one of these mistakes produces a stack
        # that starts, serves, and looks fine \u2014 which is exactly why they are asserted
        # rather than reviewed.
        env:
          COMPOSE_PROJECT_NAME: msout
          PUBLIC_HOST: one-backend.phttp.com
          ACME_EMAIL: ops@example.com
          ALLOWED_ORIGINS: https://app.example.com
        run: |
          docker compose -f docker-compose.yml config --format json \
            | node .github/assert-compose.mjs

      - name: the assertions can actually fail
        # A check that cannot fail is not a check. This feeds deliberately broken
        # configs to the assertion script and requires each one to be caught.
        #
        # It exists because the first version of the socket check stringified the
        # volume list and matched the mount *target* \u2014 so repointing the source at
        # an unrelated path still passed. A static check that silently checks the
        # wrong half of a thing is worse than no check, because it reads as coverage.
        run: node .github/assert-compose.test.mjs

      - name: no secret is committed
        # The compose file names the paths of Docker secrets, never their values. A
        # value here means a real secret is in git history.
        run: |
          if grep -nE '^\s*(CSRF_KEY|ORCHESTRATOR_HMAC_SECRET|SESSION_SECRET)\s*[:=]\s*\S' \
               docker-compose.yml 2>/dev/null; then
            echo "a secret appears to be assigned inline in a compose file"
            exit 1
          fi
          echo "no inline secrets"