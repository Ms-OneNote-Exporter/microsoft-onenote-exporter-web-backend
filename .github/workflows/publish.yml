# Publishes the three images to GHCR.
#
# ## Why this exists
#
# The deployment pulled `ghcr.io/…/msout-api:<commit>` and `msout-orchestrator`:
# those were published by hand, and there is no workflow for it. So the **runner
# image had never been published at all** — and the orchestrator's default
# `ORCH_RUNNER_IMAGE` is `ghcr.io/ms-one-note-exporter/runner:0.0.0`, a tag that
# does not exist.
#
# The result was discovered by deploying: every login failed with the pool unable
# to fill, `ghcr.io/…/msout-runner:0.0.0` → `denied`, and nothing in the repository
# said that publishing was a step anyone had to remember. A deployment that cannot
# start a runner because an image was never pushed is a missing control, not a
# misconfiguration.
#
# ## Why tagged by commit and never `latest`
#
# `ORCH_RUNNER_IMAGE` names an exact tag, and the api and orchestrator are stamped
# with the commit they were built from. A mutable tag would let a container start
# with code nobody reviewed, which is the same class of problem as the two failures
# already fixed in this repository — see `docker-compose.yml`'s `IMAGE_TAG`
# comment, where a duplicate key silently took the last value.
#
# ## Credentials
#
# `GITHUB_TOKEN` with `packages: write`. A deploy host needs a token with `repo`
# scope to *pull* a private package; this workflow does not create one, and
# deliberately does not — see the README's note on the VPS pull token.
#
# ## What is deliberately absent
#
# No `latest`, no floating tag, no rebuild-on-schedule. A tag is either the
# commit someone reviewed or it is not.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, and stated per-job rather than inherited. This job writes to a
# package registry and does nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  # One publish at a time. Two concurrent runs would race on the same tags, and the
  # loser's image would be overwritten by the winner's — which is exactly the
  # "code nobody reviewed" problem above, reached by a different route.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased once, into an env var, rather than `github.repository_owner`
      # inline in every tag.
      #
      # The owner is `Ms-OneNote-Exporter` and an OCI repository name must be
      # lowercase, so the first version of this workflow failed on its very first
      # push with `repository name must be lowercase` — on the tag, before any
      # build. Docker accepts the mixed-case name as an *alias* on pull and
      # normalises it, which is exactly why it looked right everywhere else and
      # only failed here.
      - name: resolve the registry prefix
        run: echo "REGISTRY_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # The runner is the one that matters and the slowest: it installs
      # Playwright's Chromium, which is the largest layer and the one a
      # cross-platform build would be slowest to produce. Built on the native
      # amd64 runner with no QEMU emulation for the target platform.
      - name: build and push the runner
        uses: docker/build-push-action@v6
        with:
          context: ./runner
          file: ./runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/msout-runner:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}/msout-runner:${{ github.sha }}-short
          build-args: |
            BUILD_ID=${{ github.sha }}
          # Provenance and SBOM, because a container that holds credential bytes is
          # exactly the artifact whose contents should be attestable later.
          provenance: true
          sbom: true
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: build and push the api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/msout-api:${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: build and push the orchestrator
        uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          file: ./orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/msout-orchestrator:${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator

      # The deploy host is told what exists, because a hand-maintained list of
      # tags is the same class of thing as a hand-maintained secret list: correct
      # until someone forgets, and then silently wrong.
      - name: record the published tags
        run: |
          {
            echo "### Published on ${{ github.sha }}"
            echo
            echo "- \`msout-runner:${{ github.sha }}\` (and \`-short\`)"
            echo "- \`msout-api:${{ github.sha }}\`"
            echo "- \`msout-orchestrator:${{ github.sha }}\`"
            echo
            echo "A deploy host sets \`IMAGE_TAG=${{ github.sha }}\` and"
            echo "\`ORCH_RUNNER_IMAGE=${{ env.REGISTRY_PREFIX }}/msout-runner:${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"