# The whole stack.
#
# ## The host name is written down once
#
# `PUBLIC_HOST` in `.env` is the only place the domain appears. The api reads it as
# `PUBLIC_ORIGIN`, and Caddy substitutes it into the site address, so changing the
# domain is a single edit rather than a search for every spelling of it.
#
# The three places that must agree, when you do change it:
#
#   PUBLIC_HOST      here, in .env
#   PUBLIC_ORIGIN    derived from it below, and read by the api
#   VITE_API_ORIGIN  mac's frontend build — he is told separately
#
# ## What is deployed, and what is not
#
# This file describes three services: caddy, api, orchestrator. The **runner
# service does not exist yet** — it depends on `@msout/*` packages that are not
# published (§12 steps 1–2), and `msout-runner` is declared below with no service
# attached so the network exists to be documented. Do not read this file as a
# working deployment; see infra/README.md.

name: msout

x-restart: &restart
  restart: unless-stopped

# ---- networks ---------------------------------------------------------------

networks:
  # The control plane. `internal: true` is the single most consequential word in
  # this file: it means these services have **no route to the internet**. The
  # orchestrator talks only to the Docker socket, which is not a network, so it
  # needs no egress — and §2.1 forbids it having any.
  #
  # CI asserts this. A network declared without `internal: true` still works, so
  # nothing would fail; it would just quietly let the orchestrator reach the
  # internet, which is the thing the whole component split exists to prevent.
  msout-control:
    internal: true

  # The edge. Caddy is the only member, and it is the only service that needs to be
  # reachable from outside.
  msout-edge: {}

  # The credential path: `api` and the runners, and nobody else.
  #
  # `internal: true` is the load-bearing word. A container on an internal network
  # has no default route, so joining this one cannot give `api` egress — which is
  # §2.1's "the api reaches the internet: no", and the reason this network exists
  # instead of putting the api on msout-runner.
  #
  # The runner joins both this and msout-runner, so it gets the Microsoft hosts it
  # needs and a route to `api`. Two networks rather than one is what keeps those
  # two properties from cancelling: one network cannot be both reachable and
# # unrouted.
  #
  # The orchestrator is deliberately NOT here. It holds the Docker socket, and the
  # credential should be one hop away from it rather than on it.
  msout-runner-api:
    internal: true
    # An explicit `name`, and it is load-bearing rather than cosmetic.
    #
    # Compose prefixes a network with the **project name** — `msout_msout-runner` —
    # while `ORCH_RUNNER_NETWORK` names it `msout-runner`. The orchestrator builds
    # its create request by name, so it asked the Engine for a network that does not
    # exist and every slot failed with:
    #
    #     404 {"message":"network msout-runner not found"}
    #
    # CI never caught it because in the capability suite the **compose** file
    # creates the runner, so the orchestrator's create path is never exercised. The
    # first real deployment failed on it.
    #
    # Declaring `name:` here makes the network the orchestrator expects, by
    # construction rather than by the two defaults happening to agree. Both runner
    # networks need it: `msout-control` and `msout-edge` are only ever used through
    # compose's service DNS, so nothing outside compose names them.
    name: msout-runner-api

  # ---- the runner's egress: deliberately unrestricted ------------------------
  #
  # **A runner may make any outbound call to the internet.** That is a decision,
  # not an omission, and it reverses what this comment used to say.
  #
  # ## Why there is no allowlist of Microsoft hosts
  #
  # An allowlist derived from hosts observed during a real login is brittle in a way
  # the rest of this stack is not. Microsoft changes a hostname — a SharePoint
  # tenant, an asset CDN, a regional login endpoint — and the product breaks with
  # **no signal**: no error, no failing test, just sign-in that stopped working.
  #
  # The failure is silent because there is nothing to assert against. An allowlist
  # can only be as current as the last login someone observed, and the observation
  # that mattered is the one nobody made. Compare the rest of this file, where every
  # property is asserted rather than maintained.
  #
  # PLAN-v3 §2.1 already draws this line correctly, and it is worth stating the
  # distinction it makes, because it is the one this comment previously blurred:
  # deny the things Microsoft will *never* log in through; do not enumerate the
  # things it might change.
  #
  # ## What is denied, and why it is not an allowlist
  #
  # The runner cannot reach:
  #
  #   - the Docker socket on the host
  #   - `msout-api-1`, the orchestrator, or anything else on the internal networks
  #   - the cloud metadata service (`169.254.169.254`)
  #   - the host gateway
  #
  # **None of that is a list**, which is the point. It is topology: `msout-runner`
  # is a plain bridge network with one member, and Docker does not give it a route
  # to the host's interfaces, to the metadata service, or to another network's
  # containers. Microsoft changing a hostname cannot alter any of it.
  #
  # `capability.yml` asserts this **from inside a running container**, because
  # topology nobody checks is topology that quietly changes. And the one thing worth
  # adding at the host level is the metadata service and the gateway: those are
  # reachable on instance types that have them, they are a credential-theft path for
  # the *instance* rather than for us, and denying them constrains nothing Microsoft
  # does. See infra/README.md.
  msout-runner:
    # `name:` for the same reason as `msout-runner-api` above — the orchestrator
    # names this network when it creates a container, so it must exist under that
    # name and not under `<project>_msout-runner`.
    name: msout-runner

# ---- secrets ----------------------------------------------------------------

secrets:
  # Files, never environment variables. An env var is visible in `docker inspect`,
  # in `/proc/<pid>/environ`, and to anything that can read the container's config —
  # including a container that has no business knowing the value.
  #
  # The files are created by the operator; see .env.example and infra/README.md.
  csrf_key:
    file: ${SECRETS_DIR:-./secrets}/csrf_key
  orchestrator_hmac_secret:
    file: ${SECRETS_DIR:-./secrets}/orchestrator_hmac_secret
  # The runner's bearer token, so the orchestrator can authenticate to it.
  #
  # Not a session credential: it authorises the orchestrator to *start* work in a
  # container it created, and never carries or reveals a password. A file rather
  # than an environment variable for the same reason as the other two — an env var
  # is visible in `docker inspect` to anything that can read the container config.
  runner_token:
    file: ${SECRETS_DIR:-./secrets}/runner_token

# ---- services ---------------------------------------------------------------

services:
  caddy:
    <<: *restart
    image: caddy:2.10-alpine
    networks:
      - msout-edge
      - msout-control
    ports:
      # 80 and 443 only. Nothing else in the stack has a published port, which is
      # what makes the capability assertions meaningful: the api is unreachable
      # from the host, let alone from the internet.
      - "80:80"
      - "443:443"
      # 443/udp for HTTP/3. Optional; commented out because it doubles the
      # certificate path for no benefit on a single-origin site.
      # - "443:443/udp"
    environment:
      # The one knob. See the header.
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env - the api's public host name}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS material. Named volume rather than a bind so the host path is not a
      # thing an operator has to create with the right ownership.
      - caddy-data:/data
      - caddy-config:/config
    # Caddy reads its config and serves files. It gets no docker socket, no host
    # tree, and no secrets: it makes no authorisation decision of its own, only
    # relays one the api made.
    cap_drop:
      - ALL
    cap_add:
      # Binding 80/443 needs NET_BIND_SERVICE. Nothing else is granted.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Caddy's own answer, not the api's: this probes the proxy, and a healthy
      # proxy pointing at a dead api is not a healthy proxy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *restart
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        # The commit this image is, surfaced as `build` on /api/public/version.
        # Set IMAGE_TAG to the commit and the two cannot drift.
        BUILD_ID: ${IMAGE_TAG:?set IMAGE_TAG in .env - the commit this image is}
    image: ghcr.io/ms-one-note-exporter/msout-api:${IMAGE_TAG:-dev}
    networks:
      # msout-control only, and that is deliberate rather than incidental.
      #
      # Caddy is on msout-control too, so it can reach the api without the api
      # being on the edge network. That keeps `msout-edge` a single-member network
      # holding only the process that terminates TLS — so "the api is unreachable
      # from outside" becomes a consequence of the topology rather than of
      # remembering not to publish a port.
      #
      # What the api must NOT have is a published port, and it has none.
      - msout-control
      # msout-runner-api, and this is the second of the api's two networks. It is
      # `internal: true`, so it cannot add egress — the point of the whole
      # arrangement. The api needs a route to a runner to hand over the
      # credential, and the only network that has runners on it has egress.
      #
      # Note what this does *not* include: `msout-runner`, which would work and
      # would hand the browser-facing component a route to the internet.
      - msout-runner-api
    environment:
      # Derived from the single knob. https, because in production the cookie is
      # `__Host-` and therefore Secure-only.
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set the exact frontend origin(s), comma separated}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-2048}
      ORCHESTRATOR_URL: http://orchestrator:9100
      DATABASE_PATH: /srv/msout/data/api.db
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Secrets as file *paths*. The env vars carry paths, not values — see the
      # `secrets` block above for why the distinction matters.
      CSRF_KEY_FILE: /run/secrets/csrf_key
      ORCHESTRATOR_HMAC_SECRET_FILE: /run/secrets/orchestrator_hmac_secret
      # The path, never the value — same rule as every other secret here. An env
      # var carrying the token would be visible in `docker inspect` to anything
      # that can read this container's config.
      RUNNER_TOKEN_FILE: /run/secrets/runner_token
    secrets:
      - csrf_key
      - orchestrator_hmac_secret
      # The bearer token a runner requires on every route but /healthz.
      #
      # The api holds this because it is now the component that calls a runner —
      # the orchestrator creates them but does not drive them. That is a real
      # change to §2.1's "the orchestrator is the only thing that talks to a
      # runner", and it is worth being explicit about why the token is the right
      # thing to hand over rather than something the orchestrator proxies:
      #
      #   - The api is the only process that ever holds credential bytes *and* can
      #     reach a runner, so it is the only process that could need this.
      #   - It authorises starting work in a container that already exists. It
      #     never carries or reveals a password, and it cannot create a container
      #     — `api` still has no Docker socket.
      #   - A per-slot token would be tighter (a compromised api could then reach
      #     only one runner), at the cost of a token lifecycle, a revoke path, and
      #     the orchestrator having to mint and hand out credentials it must then
      #     track. Not taken now; noted rather than forgotten.
      - runner_token
    volumes:
      # The SQLite database. Named volume, so the host path is not an operator
      # chore and the ownership is already right for the non-root user.
      - api-data:/srv/msout/data
    # The api holds no Docker socket, no vault mount and no egress (§2.1). The
    # networks reflect that: it is on msout-control for the orchestrator call and
    # on msout-edge only so Caddy can reach it — neither of which is a route to
    # the internet, because Caddy is the only member of msout-edge.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      orchestrator:
        condition: service_healthy

  orchestrator:
    <<: *restart
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: ghcr.io/ms-one-note-exporter/msout-orchestrator:${IMAGE_TAG:-dev}
    networks:
      # msout-edge deliberately absent: the orchestrator is not reachable from
      # outside at all, and has no reason to be.
      - msout-control
    environment:
      # `ORCH_`-prefixed, which is the orchestrator's own namespace and not the
      # api's. It previously read `ORCHESTRATOR_HMAC_SECRET_FILE`, which is the
      # name the *api* uses, so the secret never arrived and the orchestrator
      # refused to start with "HMAC secret is absent or empty" — while Docker
      # reported the container as merely unhealthy.
      #
      # Two components sharing a secret file but not a variable name is a
      # reasonable design; it just has to be spelled correctly, and nothing in
      # either test suite could have caught it because both mock the other side.
      ORCH_HMAC_SECRET_FILE: /run/secrets/orchestrator_hmac_secret
      # Every variable the orchestrator reads is `ORCH_`-prefixed. Three of the
      # four below were previously written without that prefix — POOL_SIZE and
      # RUNNER_TTL_SECONDS were silently ignored and the process fell back to its
      # built-in defaults, so the pool came up at 4 instead of the configured 2 and
      # nothing said so.
      #
      # RUNNER_TTL_SECONDS does not exist at all: the orchestrator's recycle budget
      # is a compile-time constant (5 minutes, PLAN-v2 §2.1), so it is dropped
      # rather than renamed. A variable that configures nothing is worse than no
      # variable, because an operator changes it and believes it took effect.
      #
      # assert-compose.mjs checks the whole set, so a name that drifts out of the
      # namespace fails a test rather than a deployment.
      ORCH_POOL_SIZE: ${POOL_SIZE:-2}
      # A runner's CPU allowance, in billionths of a core. 2e9 is POC §18's two
      # cores and the default, and it is configurable because a hardcoded 2 made
      # this orchestrator unable to create a container at all on a host with fewer
      # than two: the Engine rejects the whole create request, the pool stays empty,
      # and every login then reports "every session is busy" while `/healthz` says
      # `ok`. Found by deploying to a 1-CPU VPS.
      #
      # Set it to the host's core count or lower — with POOL_SIZE slots all wanting
      # this many, `POOL_SIZE × RUNNER_NANO_CPUS` is what the host has to cover.
      # Below 10000 the Engine rejects it, and the orchestrator refuses it at config
      # load rather than on every pool top-up.
      ORCH_RUNNER_NANO_CPUS: ${RUNNER_NANO_CPUS:-2000000000}
      # Which runner image the orchestrator creates containers from.
      #
      # This was missing from the compose file entirely, so the orchestrator fell
      # back to its own built-in default — `ghcr.io/ms-one-note-exporter/runner:0.0.0`
      # — which is **not the name publish.yml pushes**. Every login failed with
      # `No such image`, and nothing in this file said a deploy host could change
      # it, so the only fix was to know the default was wrong.
      #
      # The default keeps the orchestrator's own, so a deployment that says nothing
      # behaves identically. What changes is that the variable is *visible*: a
      # deploy host sets `RUNNER_IMAGE` to the tag `publish.yml` reported, which is
      # the whole mechanism.
      #
      # The tag must be a commit SHA. A mutable tag would let a container start
      # with code nobody reviewed.
      ORCH_RUNNER_IMAGE: ${RUNNER_IMAGE:-ghcr.io/ms-one-note-exporter/runner:0.0.0}
      # The **host** path of the bearer token every runner mounts read-only.
      #
      # A *path*, like every other secret here: the orchestrator never reads the
      # value, it bind-mounts the file into each runner, and the runner reads it from
      # its own /run/secrets. So the value is never in this container's
      # environment, and never in `docker inspect`.
      #
      # **This must be a host path, not the container path the orchestrator itself
      # mounts the secret at.** It used to be hardcoded to
      # `/run/secrets/runner_token` — which is the *container's* path — and the
      # comment above it claimed that made the default correct. It does not:
      #
      #   1. the orchestrator bind-mounts this value as the **source** when creating
      #      each runner, and a bind source is resolved on the host
      #   2. that path does not exist on the host
      #   3. so Docker **creates a directory** there
      #   4. so the runner mounts a directory over its own secret path, tries to
      #      read a file inside it, and exits 1:
      #
      #      MSOUT_RUNNER_TOKEN_FILE could not be read at /run/secrets/runner_token:
      #      ENOENT: no such file or directory, open '/run/secrets/runner_token'
      #
      # Every container still started and `/healthz` still said `ok`. It only
      # surfaced on the first real login attempt, on a real host.
      #
      # So it points at `SECRETS_DIR`, the same directory the `secrets:` block
      # below reads, and `RUNNER_TOKEN_HOST_FILE` overrides it for a deployment that
      # keeps them elsewhere. `assert-compose.mjs` requires the two to agree, which
      # is what makes this stick.
      ORCH_RUNNER_TOKEN_FILE: ${RUNNER_TOKEN_HOST_FILE:-${SECRETS_DIR:-./secrets}/runner_token}

      # No PUBLIC_HOST, no ALLOWED_ORIGINS, no CSRF key. The orchestrator is not a
      # component that should know any of them, and its absence here is a property
      # rather than an omission — CI asserts the runner image sees no session
      # secret, and this is the same idea one step earlier.

    # The docker socket is root:docker mode 0660 on the host, and this image runs
    # as uid 65532 (distroless `nonroot`). Without this the orchestrator dies with
    # "permission denied" on the socket — which it did, on the first deploy.
    #
    # `group_add` rather than running as root, because root would work and would
    # throw away the entire argument for a separate component: the reason the
    # orchestrator is the only process with the socket is that it is the only
    # process whose compromise means container creation, and running it as root
    # would add "and root" to that sentence.
    #
    # The host's docker group must have this GID. `_DOCKER_GID` is set in .env from
    # `getent group docker | cut -d: -f3`; startup asserts it is set, because a
    # missing GID here means the orchestrator cannot reach its one dependency and
    # the failure appears as an opaque permission error.
    group_add:
      - "${_DOCKER_GID:?set _DOCKER_GID to the host docker group gid; see infra/README.md}"
    secrets:
      - orchestrator_hmac_secret
      # The runner's bearer token. The orchestrator never reads the *value* — it
      # bind-mounts this file into each runner it creates, and the runner reads it
      # from its own /run/secrets. So the orchestrator can hand out a token it
      # presents without the token ever being in its environment or in
      # `docker inspect`.
      #
      # Without this mount, `buildCreateRequest` names
      # /run/secrets/runner_token as a bind source that does not exist in the
      # orchestrator container, and Docker creates the *directory* — so the runner
      # mounts an empty directory over its secret path, reads a path, and exits 1.
      # That is the shape of failure this whole entry exists to prevent.
      - runner_token
    volumes:
      # The ONLY docker socket in the stack. This is the entire reason the
      # orchestrator is a separate component: it is the only process whose
      # compromise would mean container creation, so it is the only process that
      # gets the socket.
      #
      # Read-write is required — Docker has no read-only socket mode, and a
      # container engine that cannot create containers cannot manage a pool. This
      # is the sharpest edge in the deployment and it is why §2.1 gives the
      # orchestrator no egress at all.
      - /var/run/docker.sock:/var/run/docker.sock
      - artifacts:/srv/msout/artifacts
      # The session vault, `/srv/msout/vault/<guid>` — a **named volume**, and it
      # has to be.
      #
      # It was not mounted at all, so the orchestrator created it *inside the
      # container's writable layer*. The plan's host-path table says this data is
      # at `/srv/msout/vault/<guid>`; in practice every session's auth.json, its
      # exported vault and its logs were one `docker compose up -d
      # --force-recreate orchestrator` away from being deleted, mid-export. Nothing
      # lost it, so nothing reported it.
      #
      # A named volume rather than a bind mount for the reason `runner-data` gives:
      # erase becomes one directory removal, and no host path has to be created with
      # the right ownership before the first login.
      #
      # The image prepares this directory owned by `nonroot`, and Docker seeds a
      # fresh named volume from the image's directory *and its ownership* — so the
      # orchestrator can create `<guid>` inside it. Without that, the first login
      # failed with `mkdir /srv/msout/vault: permission denied`.
      - vault:/srv/msout/vault
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/orchestrator", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- the runner ----------------------------------------------------------
  #
  # §12 steps 1–2. Started by the orchestrator, one per export session, not by
  # compose: `deploy.replicas` would be wrong, because the container holds one
  # session's credential and one browser, and two of them in one compose project
  # would share a data root.
  #
  # It is declared here as a profile so `docker compose up` does not start it and
  # the image can still be built and the compose config still checked. The
  # orchestrator creates runners by name and network, not through this block.
  #
  # Three absences are load-bearing, and each is asserted by capability.yml rather
  # than left to a reader of this file:
  #
  #   - no CSRF key, no session secret, and neither in its environment. This
  #     process holds the credential bytes and nothing else.
  #   - no bind mounts. Its data root is a named volume, so erase is one removal.
  #   - no docker socket. Only the orchestrator may create containers.
  #
  # It *does* hold MSOUT_RUNNER_TOKEN_FILE, which is a token for talking to the
  # orchestrator and not a session credential — see secrets below.
  runner:
    profiles: ["runner"]
    <<: *restart
    build:
      context: ./runner
      args:
        BUILD_ID: ${IMAGE_TAG:-local}
    image: ghcr.io/ms-one-note-exporter/msout-runner:${IMAGE_TAG:-local}
    networks:
      - msout-runner
      # The credential path. `api` is the only other member; the orchestrator is
      # not, so this network cannot be a route to the Docker socket.
      #
      # Both this and msout-runner are load-bearing together: one gives the runner
      # Microsoft, the other gives it `api`, and neither alone can be both.
      - msout-runner-api
    # Published to nothing. The orchestrator reaches it over the runner network by
    # container name; there is no route from the host, so a compromised runner is
    # not a published API.
    environment:
      MSOUT_DATA_ROOT: /data
      MSOUT_ARTIFACT_ROOT: /artifacts
      MSOUT_RUNNER_TOKEN_FILE: /run/secrets/runner_token
    secrets:
      - runner_token
    volumes:
      - runner-data:/data
      - artifacts:/artifacts
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The runtime flags from POC §18, as compose properties. `--no-sandbox` is
    # deliberately absent: the renderer sandbox stays on, and a host that cannot
    # enable unprivileged user namespaces is a host prerequisite, not a default.
    # The integration test in .github/workflows/ is the gate on that.
    shm_size: 1gb
    # `pids` under `deploy.resources.limits`, not the top-level `pids_limit`.
    # Compose rejects a file that sets both to different values, and it is a
    # confusing error rather than an obvious one — so the form the rest of the file
    # uses is the form used here, and the memory limit lives beside it.
    deploy:
      resources:
        limits:
          # Settable, because `4g` on a smaller host is not a limit the kernel can
          # honour in isolation — it is the *whole machine*. On a 3 GB VPS a
          # Chromium spike pushes the host into swap or the OOM killer, and what
          # gets killed is whichever process the kernel picks, which can be the
          # api or the orchestrator rather than the runner.
          #
          # So the limit is operator configuration and the operator sizes it to
          # what the host actually has, minus room for everything else. `2g` is
          # chosen here as the default because it is the honest number for a small
          # VPS; a larger host should raise it.
          #
          # `shm_size: 1gb` above is separate and is NOT reduced with it: Chromium
          # crashes on Docker's 64 MB /dev/shm default, which is the single most
          # load-bearing flag on this container. It is a shared-memory mount, not
          # host RAM, so it does not compete with the limit here.
          memory: ${RUNNER_MEMORY_LIMIT:-2g}
          pids: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  api-data:
  artifacts:
  # The orchestrator's session vault. See the `vault:` mount above for why it is a
  # volume and why it was a bug that it was not one.
  vault:
  caddy-data:
  caddy-config:
  # The runner's session data: one subdirectory per session guid, holding the auth
  # file, the exported vault, and the packages' own logs and dumps. A named volume
  # rather than a bind mount, so the runner has no host path and erase is a single
  # directory removal. The runner writes the artifact to `artifacts`, which it
  # shares with the orchestrator — that is the handover.
  runner-data: